function impMissing(q){
  // 只有题干缺了必须拦；答案缺了可以入成"草稿"（老题库常常没有答案列）
  return {
    stem: !String(q.stem || '').trim(),
    answer: !String(q.answer || '').trim(),
  };
}
function impBadCount(){
  // 只算"缺题干"：那才是拦住入库的。缺答案的能入成草稿，单独报一句更准确。
  return IMP.items.filter(q=>impMissing(q).stem).length;
}
function impNoAnsCount(){
  return IMP.items.filter(q=>{ const m = impMissing(q); return !m.stem && m.answer; }).length;
}

/** 说明这批结果是怎么来的：AI 认的要多核一遍，本地规则认的通常可以直接入库 */
function impByNote(){
  const by = String(IMP.by || '');
  if(!by) return '';
  let text = '', bg = '#f5f7fb', color = 'var(--text-2)';
  if(by.indexOf('ai-vision') >= 0){
    text = '这批题是 AI 看图识别出来的，手写、盖章、拍照倾斜都可能认错字，入库前请逐条看一眼题干和答案。';
    bg = '#fff8e6'; color = '#7a5b12';
  }else if(by.indexOf('local-ocr+ai') >= 0){
    text = '这批题由本地 OCR 认字、AI 整理成题目（模型没通过看图检测或看图失败时的兜底路）。题干与答案是否正确取决于 OCR 认字质量，请逐条核对。';
    bg = '#fff8e6'; color = '#7a5b12';
  }else if(by.indexOf('ai') >= 0){
    text = '这批题是 AI 识别出来的（材料版式不规整，本地规则没拆出来）。建议重点核对题干与答案。';
    bg = '#fff8e6'; color = '#7a5b12';
    if(by.indexOf('local') >= 0) text = '部分块由 AI 识别、部分块按本地规则拆出，建议核对 AI 那部分。';
  }else{
    text = '这批题是按本地规则拆出来的（未联网，未产生费用）。';
  }
  if((IMP.chunks || 1) > 1) text += ' 材料较长，分 ' + IMP.chunks + ' 块处理。';
  return `<div style="padding:9px 16px;background:${bg};border-bottom:1px solid var(--line-soft,#e8eaf0);
    font-size:12.3px;color:${color};line-height:1.7">${esc(text)}</div>`;
}

function renderImportResult(){
  const cats = STATE.cats;
  const rows = IMP.items.map((q,i)=>{
    const cat = cats.find(c=>c.id===q.cat_id) || cats[0];
    const subs = (cat && cat.subs) || [];
    const miss = impMissing(q);
    const cls = [miss.stem ? 'warn-stem' : '', miss.answer ? 'warn-ans' : '',
                 q.dup ? 'dup-row' : ''].filter(Boolean).join(' ');
    const dupTag = q.dup
      ? `<span class="dup-tag" title="题库已有：${esc(q.dup_stem || '')}（相似度 ${Math.round((q.dup_score||0)*100)}%）">疑重复</span>`
      : '';
    return `<tr data-row="${i}" class="${cls}">
      <td class="c-chk"><input type="checkbox" style="width:15px;height:15px" ${IMP.sel.has(i)?'checked':''} onchange="impSel(${i},this.checked)"></td>
      <td class="c-type"><select onchange="impSet(${i},'qtype',this.value)">
        ${STATE.types.map(t=>`<option value="${t.key}" ${q.qtype===t.key?'selected':''}>${t.name.replace('项选择','选').replace('判断题','判断').replace('填空题','填空').replace('问答题','问答')}</option>`).join('')}
      </select></td>
      <td><div class="stem-cell">${dupTag}<input class="stem-in" value="${esc(q.stem)}" onchange="impSet(${i},'stem',this.value)"></div></td>
      <td class="c-opt">${(q.qtype==='single'||q.qtype==='multi') && q.options && q.options.length
        ? q.options.map((o,oi)=>`<div class="opt-edit"><span class="opt-key">${esc(o.key||'ABCDEF'[oi])}</span><input value="${esc(o.text||'')}" placeholder="选项内容" onchange="impSetOpt(${i},${oi},this.value)"></div>`).join('')
        : '-'}</td>
      <td class="c-ans"><input value="${esc(q.answer)}" ${miss.answer?'placeholder="缺答案"':''} onchange="impSet(${i},'answer',this.value)"></td>
      <td class="c-diff"><select onchange="impSet(${i},'diff',this.value)">
        ${STATE.diffs.map(d=>`<option value="${d.key}" ${q.diff===d.key?'selected':''}>${d.name}</option>`).join('')}
      </select></td>
      <td class="c-cat"><select onchange="impSetCat(${i},Number(this.value))">
        ${cats.map(c=>`<option value="${c.id}" ${cat&&cat.id===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select></td>
      <td class="c-sub"><select onchange="impSet(${i},'sub_id',Number(this.value))">
        ${subs.length?subs.map(s=>`<option value="${s.id}" ${q.sub_id===s.id?'selected':''}>${esc(s.name)}</option>`).join(''):'<option value="">—</option>'}
      </select></td>
      <td class="c-del"><button class="del-btn" title="移除这一题" onclick="impDel(${i})">×</button></td>
    </tr>`;
  }).join('');
  const bad = impBadCount();
  const noAns = impNoAnsCount();
  const dupN = IMP.items.filter(q=>q.dup).length;
  return `<div class="card">
    <div class="card-h">
      <b>识别结果 <span id="impCount" style="font-weight:400;color:var(--text-2);font-size:12.5px">共 ${IMP.items.length} 题，已选 ${IMP.sel.size} 题${bad?`，<span style="color:#b45309">${bad} 题缺题干</span>`:''}${noAns?`，<span style="color:#b42318">${noAns} 题缺答案（可先入库再补）</span>`:''}</span>${dupN?`<span id="impDupNote" class="dup-note">${dupN} 题与题库疑似重复，默认未勾选</span>`:''}</b>
      <div class="actions">
        <button onclick="impAll(true)">全选</button>
        <button onclick="impAll(false)">全不选</button>
        <button onclick="impBulkCat()">批量设置分类</button>
        <button class="primary" onclick="commitImport()">确认入库（${IMP.sel.size}）</button>
      </div>
    </div>
    ${impByNote()}
    ${(IMP.failedChunks && IMP.failedChunks.length) ? `<div style="padding:10px 16px;background:#fdf3f3;border-bottom:1px solid #f0c2c2;font-size:12.3px;color:#991b1b;line-height:1.7">
      第 ${IMP.failedChunks.join('、')} 块没能识别出来（接口报错或超时），这几块的内容需要单独重导。
    </div>` : ''}
    ${IMP.warnings.length ? `<div style="padding:10px 16px;background:#fff8e6;border-bottom:1px solid #f3e0b0;font-size:12.3px;color:#7a5b12;line-height:1.7">
      ${IMP.warnings.slice(0,6).map(w=>'· '+esc(w)).join('<br>')}${IMP.warnings.length>6?`<br>· 另有 ${IMP.warnings.length-6} 条提示`:''}
    </div>` : ''}
    ${(IMP.failed && IMP.failed.length) ? `<div style="padding:10px 16px;background:#fdf3f3;border-bottom:1px solid #f0c2c2;font-size:12.3px;color:#991b1b;line-height:1.7">
      <b>${IMP.failed.length} 题未入库</b>（改完再点一次确认入库）<br>
      ${IMP.failed.slice(0,8).map(f=>'· '+esc(f.stem)+' —— '+esc((f.errors||[]).join('、'))).join('<br>')}
      ${IMP.failed.length>8?`<br>· 另有 ${IMP.failed.length-8} 条`:''}
    </div>` : ''}
    <div class="imp-table" style="overflow:auto;max-height:62vh">
      <table><thead><tr>
        <th class="c-chk"></th><th class="c-type">题型</th><th>题干</th><th class="c-opt">选项</th>
        <th class="c-ans">答案</th><th class="c-diff">难度</th>
        <th class="c-cat">分类</th><th class="c-sub">二级分类</th><th class="c-del">删除</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div>
  </div>`;
}

function rerenderImport(){  const stage = document.getElementById('impStage');
  if(stage) stage.innerHTML = renderImportResult();
}
function impSel(i, on){ if(on) IMP.sel.add(i); else IMP.sel.delete(i); rerenderImport(); }
function impAll(on){
  IMP.sel = on ? new Set(IMP.items.map((_,i)=>i)) : new Set();
  rerenderImport();
}
function impSet(i, field, v){
  IMP.items[i][field] = v;
  impMarkRow(i);
}
/** 识别结果表里直接改某个选项的文字（与题干/答案的行内编辑同一路径） */
function impSetOpt(i, oi, v){
  const o = (IMP.items[i].options||[])[oi];
  if(!o) return;
  o.text = v;
  impMarkRow(i);
}
function impSetCat(i, catId){
  const c = STATE.cats.find(x=>x.id===catId);
  IMP.items[i].cat_id = catId;
  IMP.items[i].sub_id = (c && c.subs && c.subs.length) ? c.subs[0].id : null;
  rerenderImport();
}
/** 把界面上"看起来已经选了"的默认值真正写回数据。
 *  否则下拉显示电气、提交时 cat_id 还是空，后端报"未选择一级分类"——
 *  用户看到的是一个样、存进去的是另一个样。 */
function impNormalize(){
  IMP.items.forEach(q=>{
    const c = STATE.cats.find(x=>x.id===q.cat_id) || STATE.cats[0];
    if(!c) return;
    q.cat_id = c.id;
    const subs = c.subs || [];
    if(!subs.some(s=>s.id===q.sub_id)) q.sub_id = subs.length ? subs[0].id : null;
  });
}
/** 就地更新某一行的"缺项"状态：不整表重渲染，否则正在输入的焦点会丢 */
function impMarkRow(i){
  const tr = document.querySelector('.imp-table tr[data-row="' + i + '"]');
  const q = IMP.items[i];
  if(tr && q){
    const miss = impMissing(q);
    tr.classList.toggle('warn-stem', miss.stem);
    tr.classList.toggle('warn-ans', miss.answer);
    const ans = tr.querySelector('.c-ans input');
    if(ans) ans.setAttribute('placeholder', miss.answer ? '缺答案' : '');
  }
  impUpdateCount();
}
function impUpdateCount(){
  const el = document.getElementById('impCount');
  if(!el) return;
  const bad = impBadCount();
  const noAns = impNoAnsCount();
  el.innerHTML = '共 ' + IMP.items.length + ' 题，已选 ' + IMP.sel.size + ' 题' +
    (bad ? '，<span style="color:#b45309">' + bad + ' 题缺题干</span>' : '') +
    (noAns ? '，<span style="color:#b42318">' + noAns + ' 题缺答案（可先入库再补）</span>' : '');
}
/** 整行删除：题号是下标，删掉一行后其余勾选状态必须跟着左移 */
function impDel(i){
  if(!(i >= 0 && i < IMP.items.length)) return;
  IMP.items.splice(i, 1);
  const sel = new Set();
  IMP.sel.forEach(k=>{ if(k < i) sel.add(k); else if(k > i) sel.add(k - 1); });
  IMP.sel = sel;
  if(!IMP.items.length){
    IMP = {items:[], sel:new Set(), warnings:[], failed:[], filename:''};
    route();
    toast('已移除最后一题');
    return;
  }
  rerenderImport();
  toast('已移除 1 题，剩 ' + IMP.items.length + ' 题');
}
function impBulkCat(){
  const names = STATE.cats.map(c=>c.name).join(' / ');
  const v = prompt('把已勾选的题全部设为哪个分类？（' + names + '）', STATE.cats[0].name);
  if(!v) return;
  const cat = STATE.cats.find(c=>c.name === v.trim());
  if(!cat){ toast('没有这个分类：' + v, true); return; }
  IMP.sel.forEach(i=>{ IMP.items[i].cat_id = cat.id; });
  rerenderImport();
  toast('已设置 ' + IMP.sel.size + ' 题为「' + cat.name + '」');
}
function clearImport(){
  IMP = {items:[], sel:new Set(), warnings:[], failed:[], filename:''};
  route();
}

function toB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b=>{ bin += String.fromCharCode(b); });
  return btoa(bin);
}
function importDemo(){ parseB64('示例题库.txt', toB64(DEMO_TEXT)); }

async function parseImportFile(f){
  const stage = document.getElementById('impStage');
  if(stage) stage.innerHTML = '<div class="card"><div class="empty">正在解析 ' + esc(f.name) + ' …</div></div>';
  const b64 = await new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(String(r.result || '').split(',')[1] || '');
    r.onerror = rej;
    r.readAsDataURL(f);
  });
  await parseB64(f.name, b64);
}

/** 图片与扫描件只能靠模型，接口可能要跑几十秒，进度得写清楚，别让人以为卡死 */
function parsingText(filename){
  const ext = (filename.split('.').pop() || '').toLowerCase();
  const isImage = ['png','jpg','jpeg','webp'].indexOf(ext) >= 0;
  if(IMP_ENGINE === 'local') return '正在用本地规则解析 ' + filename + ' …';
  if(isImage) return '正在让 AI 看图识别 ' + filename + ' …图片较慢，请稍候';
  if(IMP_ENGINE === 'ai') return '正在让 AI 识别 ' + filename + ' …材料长的话要等一会儿';
  return '正在解析 ' + filename + ' …';
}

/** 解析中显示的文案：拿到页码就报页码，否则沿用原来那句 */
function progressText(filename, p){
  let txt = '';
  if(p && p.stage && p.stage.indexOf('AI') >= 0)
    txt = '正在' + p.stage + '（' + filename + '）…图片型试卷每页要几分钟，请勿关闭此页面';
  else if(p && p.stage) txt = '正在' + p.stage + '（' + filename + '）…';
  else txt = parsingText(filename);
  // 预估剩余时间：按已完成项的实际耗时算，跑得越多样本越准（P31）
  if(txt){
    if(p && p.eta_sec) txt += ' 预计剩余约 ' + etaText(p.eta_sec) + '。';
    else if(p && p.elapsed >= 5) txt += ' 已用 ' + etaText(p.elapsed) + '，首项最慢，跑完一项就有预估。';
  }
  return txt;
}

function etaText(sec){
  sec = Math.max(1, Math.round(sec));
  if(sec < 60) return sec + ' 秒';
  const m = Math.round(sec / 60);
  if(m < 60) return m + ' 分钟';
  return (sec / 3600).toFixed(1) + ' 小时';
}

async function parseB64(filename, b64){
  const stage = document.getElementById('impStage');
  const job = 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  if(stage) stage.innerHTML = '<div class="card"><div class="empty">' + esc(parsingText(filename)) + '</div></div>';
  const paint = (txt)=>{
    const el = stage && stage.querySelector('.empty');
    if(el) el.textContent = txt;
  };
  // 解析请求是阻塞的，模型一页可能跑几分钟：靠轮询把"在干第几页"显示出来，
  // 否则用户看到的就是一个不动的圈，只会去点关闭。
  const timer = setInterval(async ()=>{
    try{
      const p = await API.get('/api/import/progress?job=' + encodeURIComponent(job));
      if(p && p.state === 'running') paint(progressText(filename, p));
    }catch(e){ /* 进度查不到不影响主流程 */ }
  }, 1500);
  let r;
  try{
    r = await API.post('/api/import/parse',
                       {filename:filename, content:b64, engine:IMP_ENGINE, job:job});
  }catch(e){
    toast('解析失败：' + e.message, true);
    route();
    return;
  }finally{
    clearInterval(timer);
  }
  if(!r.ok){
    if(stage) stage.innerHTML = `<div class="card"><div class="empty">${esc(r.error)}</div></div>`;
    toast(r.error, true);
    return;
  }
  IMP = {items:r.items, warnings:r.warnings || [], filename:filename,
         sel:impDefaultSel(r.items), failed:[], by:r.by || '',
         chunks:r.chunks || 1, failedChunks:r.failed_chunks || []};
  impNormalize();
  route();
  const dupN = r.items.filter(q=>q.dup).length;
  toast('识别到 ' + r.items.length + ' 题' +
        (dupN ? '，其中 ' + dupN + ' 题与题库重复（默认未勾选）' : '') + '，请核对后入库');
}

/** 默认勾选：重复题不勾，避免手快点一下就往库里塞重复题 */
function impDefaultSel(items){
  const s = new Set();
  items.forEach((q,i)=>{ if(!q.dup) s.add(i); });
  return s;
}

async function commitImport(){
  if(!IMP.sel.size){ toast('还没有勾选题目', true); return; }
  IMP.failed = [];
  // 缺题干的必须拦下（没有题干根本不成题）。缺答案的可以入成"草稿"：
  // 老题库（厂商模板导出的面试题库）常常整份没有答案列，一律拦下来等于白导。
  const noStem = [];
  const noAns = [];
  Array.from(IMP.sel).forEach(i=>{
    const m = impMissing(IMP.items[i]);
    if(m.stem) noStem.push(i + 1);
    else if(m.answer) noAns.push(i + 1);
  });
  if(noStem.length){
    toast('第 ' + noStem.slice(0, 5).join('、') + (noStem.length > 5 ? ' 等' : '') +
          ' 题缺题干；请补全或取消勾选', true);
    return;
  }
  if(noAns.length && !confirm(
      '有 ' + noAns.length + ' 题没有答案，将先入库为「缺答案」草稿。\n' +
      '草稿可以编辑补答案，但不会参与组卷。继续吗？')) return;
  const items = Array.from(IMP.sel).map(i=>IMP.items[i]);
  const btn = event && event.target;
  if(btn){ btn.disabled = true; btn.textContent = '入库中…'; }
  const r = await API.post('/api/import/commit', {items, filename: IMP.filename || '未命名文件'});
  if(btn){ btn.disabled = false; btn.textContent = '确认入库'; }
  if(!r.ok){ toast('入库失败', true); return; }
  toast('已入库 ' + r.imported + ' 题' + (r.failed ? '，' + r.failed + ' 题未入库' : ''));
  if(r.failed && r.errors && r.errors.length){
    // 不弹 alert 把页面卡住：留在本页，把失败原因贴在表格上方，改完再提交一次
    IMP.failed = r.errors;
    rerenderImport();
    impDeselectFailed(r.errors);
    return;
  }
  IMP = {items:[], sel:new Set(), warnings:[], failed:[], filename:''};
  await loadState();
  go('bank');
}

/** 未入库的题取消勾选，避免用户重复提交同一批错题 */
function impDeselectFailed(errors){
  const bad = new Set(errors.map(e=>e.stem));
  IMP.items.forEach((q,i)=>{
    if(bad.has((q.stem || '').slice(0,20))) IMP.sel.delete(i);
  });
  rerenderImport();
}

// ---------------------------------------------------------------- 系统设置
/** AI 配置（FR 之外新增）：接口地址 / 密钥 / 模型。
 *  密钥只在本机 data/ai.json，页面只显示末 4 位；留空表示不修改。 */
function aiConfigCard(){
  const ai = STATE.ai || {};
  const status = ai.ready
    ? '<span style="color:#0f7b4f">已配置，可识别图片与乱版式材料</span>'
    : '<span style="color:#b45309">未配置，只能用本地规则</span>';
  return `<div class="card">
    <div class="card-h"><b>AI 识别</b><span style="font-size:12px;color:var(--text-3)">${status}</span></div>
    <div class="card-b">
      <div class="form">
        <div class="f c6"><label>接口地址</label>
          <input id="aiBase" placeholder="https://api.deepseek.com/v1" value="${esc(ai.base_url || '')}"></div>
        <div class="f c6"><label>密钥 ${ai.has_key?`<span style="color:var(--text-3);font-weight:400">（已存 ${esc(ai.api_key_masked||'')}，留空不改）</span>`:''}</label>
          <input id="aiKey" type="password" placeholder="${ai.has_key ? '留空表示不修改' : 'sk-…'}"></div>
        <div class="f c6"><label>文本模型</label>
          <input id="aiModel" placeholder="deepseek-chat" value="${esc(ai.model || '')}"></div>
        <div class="f c6"><label>视觉模型（可选）</label>
          <input id="aiVision" placeholder="留空则用文本模型" value="${esc(ai.vision_model || '')}"></div>
        <div class="f c6"><label>视觉能力</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px">
            <span id="aiVisionState" style="font-size:12.3px">${visionStateText(ai)}</span>
            <button style="padding:3px 10px;font-size:12px" onclick="probeVision()">重新检测</button>
          </div></div>
        <div class="f c6"><label>超时（秒）</label>
          <input id="aiTimeout" type="number" min="30" step="30" value="${esc(String(ai.timeout || 300))}"></div>
      </div>
      <div class="hint" style="margin-top:8px;line-height:1.8">
        兼容 OpenAI 格式的接口都行（DeepSeek、通义千问、豆包、Kimi、OpenAI 等）。
        只填接口地址、密钥、模型名即可，末尾带上 <code>/v1</code>。
        密钥只保存在本机 <code>data/ai.json</code>，不会写进数据库、也不会出现在日志里。<br>
        导入扫描件 / 图片 PDF 时，软件会先发一张写着 AB12 的小图<b>检测模型能不能看图</b>（每个模型只测一次，结果记在本机）：
        能看图就直接把页面图交给模型识别；不能看图就改走「本地 OCR 认字 + AI 整理」，纯文本模型也能用。<br>
        带思维链的推理模型（Kimi-K3 等）识别一页扫描件要两三分钟，超时别低于 300 秒，否则会报"超时"。
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="primary" onclick="saveAiConfig()">保存</button>

        <button onclick="clearAiKey()">清除密钥</button>

      </div>

async function saveAiConfig(){
  const payload = {
    base_url: (document.getElementById('aiBase').value || '').trim(),
    model: (document.getElementById('aiModel').value || '').trim(),
    vision_model: (document.getElementById('aiVision').value || '').trim(),
    timeout: parseInt(document.getElementById('aiTimeout').value, 10) || 300,
    enabled: true,
  };
  const key = (document.getElementById('aiKey').value || '').trim();
  if(key) payload.api_key = key;      // 留空不传，后端就不会把已存的密钥抹掉
  try{
    const r = await API.post('/api/ai/config', payload);
    STATE.ai = (r && r.config) || STATE.ai;
    toast('已保存');
    route();
  }catch(e){ toast('保存失败：' + e.message, true); }
}

/** 视觉能力判定（P31）：存在 ai.json 里，键带模型名，换模型自动失效 */
function visionStateText(ai){
  if(ai && ai.vision_checked){
    return ai.vision_ok
      ? '✅ ' + esc(ai.vision_checked) + ' 支持看图（扫描件直接交给模型）'
      : '❌ ' + esc(ai.vision_checked) + ' 不支持看图（扫描件将走 本地OCR + AI）';
  }
  return '未检测（导入扫描件时自动检测一次）';
}

async function probeVision(){
  const el = document.getElementById('aiVisionState');
  const old = el ? el.textContent : '';
  if(el) el.textContent = '检测中…（发一张小图给模型）';
  try{
    const r = await API.post('/api/ai/vision-probe', {});
    if(r.config) STATE.ai = r.config;
    if(el) el.textContent = visionStateText(STATE.ai);
    if(r.vision_ok === true) toast('检测通过：该模型支持看图');
    else if(r.vision_ok === false) toast('该模型不支持看图，扫描件将走 本地OCR + AI');
    else toast('检测失败：' + (r.error || '稍后再试'), true);
  }catch(e){
    if(el) el.textContent = old || visionStateText(STATE.ai);
    toast('检测失败：' + e.message, true);
  }
}

async function clearAiKey(){
  if(!confirm('清除后图片与乱版式材料将无法识别，确定清除密钥？')) return;
  try{
    const r = await API.post('/api/ai/config', {clear_key: true});
    STATE.ai = (r && r.config) || null;
    toast('密钥已清除');
    route();
  }catch(e){ toast('操作失败：' + e.message, true); }
}

async function testAi(){
  const box = document.getElementById('aiResult');
  if(box) box.textContent = '正在测试…';
  try{
    const r = await API.post('/api/ai/test', {});
    if(box){
      box.textContent = r.ok ? ('连通正常，模型：' + (r.model || '—')) : ('连接失败：' + (r.error || ''));
      box.style.color = r.ok ? '#0f7b4f' : '#b91c1c';
    }
  }catch(e){
    if(box){ box.textContent = '测试失败：' + e.message; box.style.color = '#b91c1c'; }
  }
}

async function saveSettings(){
  const g = id => document.getElementById(id).value;
  const r = await API.post('/api/settings', {
    unit_name: g('sUnit'), paper_prefix: g('sPrefix'), duration: g('sDuration'),
    score_single: g('sSingle'), score_multi: g('sMulti'), score_judge: g('sJudge'),
    score_fill_blank: g('sFill'), score_qa: g('sQa'), backup_keep: g('sKeep'),
  });
  await loadState();
  toast('设置已保存');
  route();
}

async function catAction(action, payload){
  if(action.startsWith('del') && !confirm('确定删除？该操作不可撤销。')) return;
  const r = await API.post('/api/categories', Object.assign({action}, payload));
  if(!r.ok){ toast(r.error, true); return; }
  await loadState();
  route();
  toast('已更新分类');
}
function addCat(){
  const n = prompt('新增一级分类名称');
  if(!n) return;
  catAction('add_cat', {name: n});
}
function addSub(cid){
  const n = prompt('新增二级分类名称');
  if(!n) return;
  catAction('add_sub', {cat_id: cid, name: n});
}

async function doBackup(){
  const r = await API.post('/api/backup', {});
  if(r.ok) toast('已备份：' + r.file.split('\\\\').pop());
  route();
}
async function restoreBackup(name){
  if(!confirm('用该备份覆盖当前数据？覆盖前会自动再备份一次当前数据。')) return;
  const r = await API.post('/api/backups/restore', {name});
  if(!r.ok){ toast(r.error, true); return; }
  await loadState();
  route();
  toast('已恢复，恢复前的数据存为 ' + r.safety);
}
async function doMaintenance(action, label){
  if(!confirm('确认' + label + '？此操作不可撤销。')) return;
  const b = await API.post('/api/backup', {});
  const r = await API.post('/api/maintenance', {action});
  if(!r.ok){ toast(r.error || '操作失败', true); return; }
  await loadState();
  route();
  toast(label + '完成，已先备份');
}

function placeholder(title, lines){
  return `<div class="page-head"><div><h1>${title}</h1><p>${lines[0]}</p></div></div>
  <div class="card"><div class="placeholder"><b>该模块正在开发中</b>${lines.slice(1).map(l=>`<div>${l}</div>`).join('')}</div></div>`;

// ---------------------------------------------------------------- 路由
async function route(){
  renderNav();
  const main = document.getElementById('main');
  const hash = location.hash.replace('#','') || 'dashboard';
  const [key, query] = hash.split('?');
  const params = Object.fromEntries(new URLSearchParams(query||''));
  if(key!=='editor') EDIT = null;
  main.innerHTML = '<div class="empty">加载中…</div>';
  try{
    if(key==='dashboard'){ main.innerHTML = viewDashboard(); loadHealth(); }
    else if(key==='bank') main.innerHTML = await viewBank();
    else if(key==='editor'){ main.innerHTML = await viewEditor(params); bindEditorDom(); }
    else if(key==='import'){
      main.innerHTML = viewImport();
      loadImportLogs();
      if(params.demo){
        // demo 只消费一次：立刻从地址栏摘掉。
        // 否则 parseB64 成功后调用 route() 会再次命中 params.demo -> importDemo -> route()，
        // 形成对 /api/import/parse 的循环请求（页面上表现为「正在解析…」与结果表同时存在）。
        try{ history.replaceState(null, '', '#import'); }catch(_){}
        importDemo();
      }
    }
    else if(key==='paper'){ main.innerHTML = await viewPaper(); refreshPrecheck(); }
    else if(key==='papers') main.innerHTML = await viewPapers();
    else if(key==='paper-detail'){ main.innerHTML = await viewPaperDetail(params); if(params.tab==='ans') switchSheet(1); }
    else if(key==='settings') main.innerHTML = await viewSettings();
    else main.innerHTML = viewDashboard();
  }catch(e){
    main.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('keydown', e=>{ if(e.ctrlKey && e.key==='s'){ e.preventDefault(); if(EDIT) saveQuestion(false); } });

/** 后端自报「跑的到底是不是磁盘上的最新代码」。
 *  改了代码没重启时，ui.html（磁盘文件，刷新即生效）是新的、server.py（进程内存）是旧的，
 *  表现为"新按钮点下去报 not found"，从界面上看不出任何原因。旧后端连这个接口都没有，
 *  返回 {"ok":false,"error":"not found"} —— 那更该提示重启。 */
/** 该不该弹"运行的还是旧版本"提示。抽成纯函数是为了能被用例直接断言——
 *  提示不弹出来，这个功能就等于没做。
 *  三种输入：正常应答（看 stale）、旧后端（没有这个接口，ok=false，必须提示）、
 *  请求本身失败（null，按"不知道"处理，不吓唬人）。 */
function staleBarNeeded(st){
  if(!st) return false;
  if(st.ok === false) return true;
  return st.stale === true;
}

async function checkStale(){
  let st = null;
  try{ st = await API.get('/api/version'); }catch(_){ return; }
  if(!staleBarNeeded(st)) return;
  const bar = document.getElementById('staleBar');
  if(!bar) return;
  const unknown = st.ok === false || !('stale' in st);
  const desc = bar.querySelector('.desc');
  if(desc && unknown){
    desc.innerHTML = '<b>软件代码已更新，但本机运行的还是旧版本</b>（这个版本甚至没有自检接口），'
      + '新加的按钮点下去会报 <code>not found</code>。请先双击 <code>停止试卷系统.bat</code>，'
      + '再双击 <code>启动试卷系统.bat</code>（数据库和题库不受影响）。';
  }
  bar.hidden = false;
  document.body.classList.add('has-stale');
}

(async function(){
  checkStale();     // 不 await：自检慢一点不该拖住首屏
  await loadState();
  route();
})();
</script>
